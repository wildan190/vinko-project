services:
  # FrankenPHP (App)
  app:
    build: .
    container_name: vinko-app
    restart: always
    ports:
      - "9000:8000"   # Kita arahkan port luar 9000 ke port dalam 8000
    # Hapus baris port 443 agar tidak bentrok
    volumes:
      - .:/app
      - caddy_data:/data
      - caddy_config:/config
    environment:
      # Kita pakai http:// saja di level Docker agar tidak mencoba bind port 443
      SERVER_NAME: "http://baimo-tupipei.online" 
      FRANKENPHP_CONFIG: "worker ./public/index.php"
    depends_on:
      - db
      - redis

  # PostgreSQL (Database)
  db:
    image: postgres:15-alpine
    container_name: vinko-db
    restart: always
    environment:
      POSTGRES_DB: vinko_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: manchester
    ports:
      - "5435:5432"  # Kita geser lagi ke 5435 biar makin jauh dari default
    volumes:
      - vinko_db_data:/var/lib/postgresql/data

  # Redis
  redis:
    image: redis:alpine
    container_name: vinko-redis
    restart: always
    ports:
      - "6385:6379"  # Kita geser ke 6385

  # Laravel Horizon
  horizon:
    build: .
    container_name: vinko-horizon
    restart: always
    volumes:
      - .:/app
    command: php artisan horizon
    depends_on:
      - db
      - redis

volumes:
  vinko_db_data:
  caddy_data:
  caddy_config: