services:
  # Nginx sebagai Reverse Proxy Utama
  nginx:
    image: nginx:alpine
    container_name: vinko-proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - certs:/etc/letsencrypt
    depends_on:
      - app

  # App (FrankenPHP)
  app:
    build: .
    container_name: vinko-app
    restart: always
    # Port 9000 tidak perlu di-expose ke luar lagi karena sudah lewat Nginx internal
    expose:
      - "8000"
    volumes:
      - .:/app
    environment:
      SERVER_NAME: ":8000"
      FRANKENPHP_CONFIG: "worker ./public/index.php"
    depends_on:
      - db
      - redis

  db:
    image: postgres:15-alpine
    container_name: vinko-db
    restart: always
    environment:
      POSTGRES_DB: vinko_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: manchester
    volumes:
      - vinko_db_data:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    container_name: vinko-redis
    restart: always

  horizon:
    build: .
    container_name: vinko-horizon
    restart: always
    volumes:
      - .:/app
    command: php artisan horizon
    depends_on:
      - db
      - redis

volumes:
  vinko_db_data:
  certs: