services:
  app:
    build: .
    container_name: vinko-app
    restart: always
    volumes:
      - .:/app
    environment:
      APP_URL: "https://baimo-tupipei.online"

  web:
    image: nginx:alpine
    container_name: vinko-web
    restart: always
    ports:
      - "9000:80"
    volumes:
      - .:/app
      - ./nginx-conf/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  # Tambahkan Horizon Service
  horizon:
    build: .
    container_name: vinko-horizon
    restart: always
    volumes:
      - .:/app
    # KITA PAKSA DIAM SUPAYA NGAK RESTARTING
    command: tail -f /dev/null 
    depends_on:
      - app
      - redis

  db:
    image: postgres:15-alpine
    container_name: vinko-db
    restart: always
    environment:
      POSTGRES_DB: vinko_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: manchester
    ports:
      - "5435:5432"
    volumes:
      - vinko_db_data:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    container_name: vinko-redis
    restart: always
    ports:
      - "6385:6379"

volumes:
  vinko_db_data: