services:
  # FrankenPHP (App + Web Server)
  app:
    build: .  # <--- INI PENTING: Mengarahkan ke Dockerfile di folder yang sama
    container_name: vinko-app
    restart: always
    ports:
      - "8080:8000"
      - "443:443"
      - "443:443/udp"
    volumes:
      - .:/app
      - caddy_data:/data
      - caddy_config:/config
    environment:
      SERVER_NAME: baimo-tupipei.online
      FRANKENPHP_CONFIG: "worker ./public/index.php"
    depends_on:
      - db
      - redis

  # PostgreSQL (Tetap pakai image standar)
  db:
    image: postgres:15-alpine
    container_name: vinko-db
    restart: always
    environment:
      POSTGRES_DB: vinko_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: manchester
    ports:
      - "5433:5432"
    volumes:
      - vinko_db_data:/var/lib/postgresql/data

  # Redis (Tetap pakai image standar)
  redis:
    image: redis:alpine
    container_name: vinko-redis
    restart: always
    ports:
      - "6380:6379"

  # Laravel Horizon (Gunakan build yang sama dengan app)
  horizon:
    build: . # <--- Menggunakan Dockerfile yang sama agar extensinya lengkap
    container_name: vinko-horizon
    restart: always
    volumes:
      - .:/app
    command: php artisan horizon
    depends_on:
      - db
      - redis

volumes:
  vinko_db_data:
  caddy_data:
  caddy_config: