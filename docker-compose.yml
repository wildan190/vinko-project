services:
  # App & Web Server (FrankenPHP)
  app:
    build: .
    container_name: vinko-app
    restart: always
    ports:
      - "9000:8000"
    volumes:
      - .:/app
      - caddy_data:/data
      - caddy_config:/config
    environment:
      SERVER_NAME: "http://baimo-tupipei.online"
      FRANKENPHP_CONFIG: "worker ./public/index.php"
    depends_on:
      - db
      - redis

  # PostgreSQL
  db:
    image: postgres:15-alpine
    container_name: vinko-db
    restart: always
    environment:
      POSTGRES_DB: vinko_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: manchester
    ports:
      - "5435:5432"
    volumes:
      - vinko_db_data:/var/lib/postgresql/data

  # Redis
  redis:
    image: redis:alpine
    container_name: vinko-redis
    restart: always
    ports:
      - "6385:6379"

  # Laravel Horizon (Queue & Batching)
  horizon:
    build: .
    container_name: vinko-horizon
    restart: always
    volumes:
      - .:/app
    command: php artisan horizon
    depends_on:
      - db
      - redis

volumes:
  vinko_db_data:
  caddy_data:
  caddy_config: